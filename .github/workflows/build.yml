name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: MC ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 组内字节码一致，因此每个区间只构建一个 jar
          - mc: '1.20.1'
            label: '1.20.1-1.20.4'
            yarn: '1.20.1+build.10'
            api: '0.92.12+1.20.1'
            java: '17'
            mcdep: '>=1.20.1 <1.20.5'
          - mc: '1.20.6'
            label: '1.20.6'
            yarn: '1.20.6+build.3'
            api: '0.100.8+1.20.6'
            java: '21'
            mcdep: '1.20.6'
          - mc: '1.21.1'
            label: '1.21.1-1.21.5'
            yarn: '1.21.1+build.3'
            api: '0.116.17+1.21.1'
            java: '21'
            mcdep: '>=1.21.1 <1.21.6'
          - mc: '1.21.6'
            label: '1.21.6-1.21.8'
            yarn: '1.21.6+build.1'
            api: '0.128.2+1.21.6'
            java: '21'
            mcdep: '>=1.21.6 <1.21.9'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build
        env:
          MC: ${{ matrix.mc }}
          YARN: ${{ matrix.yarn }}
          API: ${{ matrix.api }}
          JAVA_RELEASE: ${{ matrix.java }}
          MC_DEP: ${{ matrix.mcdep }}
        run: |
          ./gradlew build --no-daemon \
            -Pminecraft_version="$MC" \
            -Pyarn_mappings="$YARN" \
            -Pfabric_api_version="$API" \
            -Pjava_release="$JAVA_RELEASE" \
            -Pminecraft_dependency="$MC_DEP"

      - name: Collect jar
        run: |
          VERSION=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2)
          mkdir -p dist
          cp "build/libs/eyelocator-${VERSION}.jar" \
             "dist/eyelocator-${VERSION}+mc${{ matrix.label }}.jar"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.mc }}
          path: dist/*.jar

  build-forge:
    name: Forge 1.20.1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build
        run: |
          cd forge
          ./gradlew build --no-daemon

      - name: Collect jar
        run: |
          VERSION=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2)
          mkdir -p dist
          cp "forge/build/libs/eyelocator-forge-${VERSION}.jar" \
             "dist/eyelocator-${VERSION}-forge-1.20.1.jar"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar-forge-1.20.1
          path: dist/*.jar

  release:
    name: Release
    needs: [build, build-forge]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all jars
        uses: actions/download-artifact@v4
        with:
          pattern: jar-*
          merge-multiple: true
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l dist
          if gh release view "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/*.jar -R "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/*.jar -R "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" --generate-notes
          fi
