plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Loom adds the essential maven repositories automatically.
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

// 构建后把 remap 好的 mod jar 部署到游戏 mods 目录。
// 目标目录优先级：-PmodsDir=... > 环境变量 MC_MODS_DIR > local.properties 的 modsDir > 默认 ~/.minecraft/mods
// 用法：./gradlew deployMod
def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
	localPropsFile.withInputStream { localProps.load(it) }
}
def modsDirProvider = providers.gradleProperty("modsDir")
		.orElse(providers.environmentVariable("MC_MODS_DIR"))
		.orElse(localProps.getProperty("modsDir", "${System.getProperty('user.home')}/.minecraft/mods"))

tasks.register("deployMod") {
	group = "deployment"
	description = "构建并部署 mod jar 到游戏 mods 目录"
	dependsOn tasks.remapJar
	doLast {
		def dest = file(modsDirProvider.get())
		dest.mkdirs()
		def built = tasks.remapJar.archiveFile.get().asFile
		// 先删掉旧的同名 mod jar，避免重复 mod id
		dest.listFiles()?.each { f ->
			if (f.isFile() && f.name ==~ /eyelocator-.*\.jar/) {
				f.delete()
			}
		}
		copy {
			from built
			into dest
		}
		println "Deployed ${built.name} -> ${dest}"
	}
}
