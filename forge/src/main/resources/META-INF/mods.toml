modLoader="javafml"
loaderVersion="[47,)"
license="MIT"
issueTrackerURL="https://github.com/Emberend/ender-pearl-seeker/issues"

[[mods]]
modId="${mod_id}"
version="${version}"
displayName="末影寻珠 (Ender Pearl Seeker)"
authors="Emberend"
description='''
用末影之眼（以及其它模组里同样会飞向某个结构的定位道具）三角定位目标，HUD 实时指路。
纯客户端模组，单人/联机都能用，不需要装到服务端。

个人项目，大部分代码由 AI 辅助编写（vibe coding）。Forge 版从未实机启动验证过，
渲染、按键、客户端命令都是照文档实现的，第一次使用可能需要调 bug。
'''
displayTest="IGNORE_CLIENT_VESION"

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="[${minecraft_version},1.20.2)"
    ordering="NONE"
    side="CLIENT"