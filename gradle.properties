org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric Properties (https://fabricmc.net/develop)
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.16.14
loom_version=1.19-SNAPSHOT

# Mod Properties
mod_version=0.11.0
maven_group=com.eyelocator
archives_base_name=eyelocator
# 目标 Java 版本（1.20.x 用 17，1.20.5+/1.21.x 用 21）
java_release=21
# fabric.mod.json 中声明的 Minecraft 版本范围（默认构建 1.21.1，覆盖 1.21.1~1.21.5）
minecraft_dependency=>=1.21.1 <1.21.6

# Dependencies
fabric_api_version=0.116.17+1.21.1
# 可选的 ModMenu 设置入口；各版本由 build-all.sh / CI 覆盖
modmenu_version=11.0.5
